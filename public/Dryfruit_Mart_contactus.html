  <style> 
    /* styles.css */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f9f9f9;
}

.container {
  display: flex;
  flex-wrap: wrap;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.left-section {
  flex: 1;
  padding: 20px;
}

.left-section h1 {
  font-size: 36px;
  color: #333;
}

.left-section h1 span {
  color: #007bff;
}

.left-section p {
  font-size: 18px;
  margin: 10px 0;
  color: #555;
}

.contact-info p {
  margin: 5px 0;
  margin-top: 20px;
}

.team-section p {
  font-size: 16px;
  margin: 20px 0 10px;
}

.job-board {
  color: #007bff;
  text-decoration: none;
  font-weight: bold;
  font-size: 11px;
}

.team-image {
  max-width: 40%;
  height:130px;
  margin-top:-70px;
  margin-left: 210px;
  border-radius: 10px;
}

.right-section {
  flex: 1;
  padding: 20px;
  background-color: #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  color: orange;
}

form label {
  display: block;
  margin: 10px 0 5px;
  font-weight: bold;
  color: #333;
}

form input, form select, form textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

form button {
  padding: 10px 20px;
  background-color: #007bff;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
}

form button:hover {
  background-color: #f1b156;
}
label{
    color: orange;
}
  </style>
</head>
