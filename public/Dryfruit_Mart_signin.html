<!DOCTYPE html>

            justify-content: center;
            align-items: center;
            height: 100vh;

        .container {
            display: flex;
            height: 80%;
            width: 80%;
            max-width: 1000px;
            background: rgb(10, 168, 136);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;

        .login-box {
            flex: 1;
            padding: 30px;
            background: #aec0f4;
        }
        
        .login-box h2 {
            text-align: center;
            color: #0056a1;
            margin-bottom: 20px;
        }
        
        .login-box form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        .login-box button {
            width: 100%;
            padding: 10px;
            background: #0056a1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .login-box button:hover {
            background: #bee196;
        }
        
        .social-login {
            display: flex;
            justify-content: space-between;
        }
        
        .social-login button {
            flex: 1;
            margin: 5px;
            padding: 10px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;

        .social-login .facebook {
